<!DOCTYPE html>
<html>
<body>

<h2>Введите PIN</h2>

<input type="password" id="pin">
<button onclick="checkPin()">Открыть</button>

<div id="secret" style="display:none;">

<h1>Секретная информация</h1>
<img src="https://files.catbox.moe/968wu5.jpg" width="300">
<p>Добро пожаловать</p>

</div>

<script>

function checkPin(){

if(document.getElementById("pin").value=="123456")
{
document.getElementById("secret").style.display="block";
}
else
{
alert("Неверный PIN");
}

}

</script>

</body>
</html>
