<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фото по PIN</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#fff;margin:0;padding:20px;text-align:center}
    .box{max-width:520px;margin:40px auto;background:#1d1d1d;padding:24px;border-radius:16px}
    input{font-size:22px;padding:12px;width:80%;border-radius:10px;border:0;text-align:center}
    button{font-size:20px;margin-top:14px;padding:12px 24px;border:0;border-radius:10px;cursor:pointer}
    #gallery{display:none;max-width:900px;margin:auto}
    img{width:100%;max-width:760px;margin:12px auto;display:block;border-radius:12px}
    .error{color:#ff6b6b;margin-top:12px}
    .note{color:#aaa;font-size:14px;margin-top:14px}
  </style>
</head>
<body>
  <div id="lock" class="box">
    <h2>Введите PIN</h2>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <br>
    <button onclick="checkPin()">Открыть</button>
    <div id="error" class="error"></div>
    <div class="note">PIN по умолчанию: 3099. Его можно поменять в коде файла.</div>
  </div>

  <div id="gallery">
    <h2>Фотографии</h2>
    <img src="https://files.catbox.moe/2grvc2.jpg" alt="Фото 1">
    <img src="https://files.catbox.moe/isu6ea.jpg" alt="Фото 2">
    <img src="https://files.catbox.moe/5b59cq.jpg" alt="Фото 3">
    <img src="https://files.catbox.moe/pq29y9.jpg" alt="Фото 4">
    <img src="https://files.catbox.moe/1nmg78.jpg" alt="Фото 5">
    <img src="https://files.catbox.moe/6v53xp.jpg" alt="Фото 6">
    <img src="https://files.catbox.moe/theqpk.jpg" alt="Фото 7">
    <img src="https://files.catbox.moe/34muww.jpg" alt="Фото 8">
    <img src="https://files.catbox.moe/dkyjde.jpg" alt="Фото 9">
    <img src="https://files.catbox.moe/6wqa2n.jpg" alt="Фото 10">
  </div>

  <script>
    const correctPin = "1234";
    function checkPin(){
      const value = document.getElementById('pin').value.trim();
      if(value === correctPin){
        document.getElementById('lock').style.display='none';
        document.getElementById('gallery').style.display='block';
      } else {
        document.getElementById('error').textContent='Неверный PIN';
      }
    }
  </script>
</body>
</html>
