<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC Фото</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 520px;
      margin: 80px auto;
      padding: 35px;
      background: #1f1f1f;
      border-radius: 24px;
    }

    input {
      width: 80%;
      font-size: 28px;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      border: none;
    }

    button {
      margin-top: 20px;
      font-size: 24px;
      padding: 14px 35px;
      border-radius: 14px;
      border: none;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      font-size: 18px;
    }

    #gallery {
      display: none;
      max-width: 900px;
      margin: 20px auto;
      padding: 15px;
    }

    img {
      width: 100%;
      max-width: 760px;
      margin: 12px auto;
      display: block;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div id="lock" class="box">
    <h1>Введите PIN</h1>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <br>
    <button onclick="checkPin()">Открыть</button>
    <div id="error" class="error"></div>
  </div>

  <div id="gallery">
    <h1>Фотографии</h1>

    <img src="https://files.catbox.moe/2grvc2.jpg" alt="Фото 1">
    <img src="https://files.catbox.moe/isu6ea.jpg" alt="Фото 2">
    <img src="https://files.catbox.moe/5b59cq.jpg" alt="Фото 3">
    <img src="https://files.catbox.moe/pq29y9.jpg" alt="Фото 4">
    <img src="https://files.catbox.moe/1nmg78.jpg" alt="Фото 5">
    <img src="https://files.catbox.moe/6v53xp.jpg" alt="Фото 6">
    <img src="https://files.catbox.moe/theqpk.jpg" alt="Фото 7">
    <img src="https://files.catbox.moe/34muww.jpg" alt="Фото 8">
    <img src="https://files.catbox.moe/dkyjde.jpg" alt="Фото 9">
    <img src="https://files.catbox.moe/6wqa2n.jpg" alt="Фото 10">
  </div>

  <script>
    const correctPin = "3099";

    function lockPage() {
      document.getElementById("gallery").style.display = "none";
      document.getElementById("lock").style.display = "block";
      document.getElementById("pin").value = "";
      document.getElementById("error").textContent = "";
    }

    function checkPin() {
      const value = document.getElementById("pin").value.trim();

      if (value === correctPin) {
        document.getElementById("lock").style.display = "none";
        document.getElementById("gallery").style.display = "block";
      } else {
        document.getElementById("error").textContent = "Неверный PIN";
      }
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        lockPage();
      }
    });

    window.addEventListener("pageshow", function () {
      lockPage();
    });
  </script>

</body>
</html>
