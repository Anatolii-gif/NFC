<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC</title>

<style>
body{
    background:black;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:#111;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:300px;
}

input{
    width:90%;
    padding:15px;
    font-size:22px;
    margin:15px 0;
    text-align:center;
}

button{
    padding:15px 40px;
    font-size:22px;
}
</style>
</head>

<body>

<div class="box">
<h1>Введите PIN</h1>

<input type="password" id="pin">

<br>

<button onclick="openPage()">Открыть</button>
</div>

<script>
function openPage(){

let pin = document.getElementById("pin").value;

if(pin=="1111"){
window.location.href="monety/";
}

else if(pin=="2222"){
window.location.href="silver/";
}

else{
alert("Неверный PIN");
}

}
</script>

</body>
</html>
