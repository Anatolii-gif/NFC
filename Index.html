<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC вход</title>
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      background: #1e1e1e;
      padding: 35px;
      border-radius: 24px;
      text-align: center;
      width: 320px;
    }
    input {
      width: 85%;
      font-size: 28px;
      padding: 14px;
      text-align: center;
      border-radius: 14px;
      border: none;
    }
    button {
      margin-top: 20px;
      font-size: 24px;
      padding: 14px 35px;
      border-radius: 14px;
      border: none;
    }
    .error {
      color: #ff6666;
      margin-top: 18px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Введите PIN</h1>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <br>
    <button onclick="openPage()">Открыть</button>
    <div id="error" class="error"></div>
  </div>

  <script>
    function openPage() {
      const pin = document.getElementById("pin").value.trim();

      if (pin === "3099") {
        window.location.href = "anatoli/";
      } else if (pin === "3090") {
        window.location.href = "anat/";
      } else {
        document.getElementById("error").textContent = "Неверный PIN";
      }
    }
  </script>

</body>
</html>
